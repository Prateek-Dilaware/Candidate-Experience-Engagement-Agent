<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TalentFlow | API Visualizer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body onload="initVisualizer()">
    <nav>
        <h1>TALENTFLOW</h1>
        <ul>
            <li><a href="/hr/engagement/">Dashboard</a></li>
            <li><a href="/static/visualizer.html" class="active"> API Visualizer</a></li>
        </ul>
    </nav>

    <main>
        <div class="header">
            <h2>API Command Center</h2>
        </div>

        <div class="api-grid">
            <!-- 1. Stage Update -->
            <div class="api-section">
                <h3>1. Update Stage</h3>
                <div class="form-group"><label>Candidate ID</label><input type="text" id="s1-id" value="CAND-001"></div>
                <div class="form-group"><label>Job ID</label><input type="text" id="s1-job" value="JOB-101"></div>
                <div class="form-group">
                    <label>New Stage</label>
                    <select id="s1-stage">
                        <!-- Dynamically populated from script.js -->
                    </select>
                </div>
                <button onclick="runUpdateStage()">Update Pipeline</button>
                <div id="res-1" class="response-area">Response...</div>
            </div>

            <!-- 2. Send Status -->
            <div class="api-section">
                <h3>2. Personalized Status</h3>
                <div class="form-group"><label>Candidate ID</label><input type="text" id="s2-id" value="CAND-001"></div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="s2-type">
                        <!-- Dynamically populated from script.js -->
                    </select>
                </div>
                <button onclick="runSendMessage()">Trigger AI Message</button>
                <div id="res-2" class="response-area">Response...</div>
            </div>

            <!-- 3. Propose Slots -->
            <div class="api-section">
                <h3>3. Propose Slots</h3>
                <div class="form-group"><label>Interviewer Email</label><input type="text" id="s3-email"
                        value="hr@talentflow.com"></div>
                <div class="form-group"><label>Date</label><input type="date" id="s3-date" value="2026-02-05"></div>
                <button onclick="runProposeSlots()">Generate Slots</button>
                <div id="res-3" class="response-area">Response...</div>
            </div>

            <!-- 4. Confirm Slot -->
            <div class="api-section">
                <h3>4. Confirm Interview</h3>
                <div class="form-group"><label>ISO Timestamp</label><input type="text" id="s4-slot"
                        placeholder="Copy from API 3"></div>
                <button onclick="runConfirmSlot()">Confirm Slot</button>
                <div id="res-4" class="response-area">Response...</div>
            </div>

            <!-- 5. Offer Letter -->
            <div class="api-section">
                <h3>5. Generate Offer</h3>
                <div class="form-group"><label>CTC</label><input type="number" id="s5-ctc" value="1200000"></div>
                <div class="form-group"><label>Joining Date</label><input type="date" id="s5-join" value="2026-03-01">
                </div>
                <button onclick="runGenerateOffer()">Draft AI Offer</button>
                <div id="res-5" class="response-area">Response...</div>
            </div>

            <!-- 6. Risk Scoring -->
            <div class="api-section">
                <h3>6. AI Risk Score</h3>
                <div class="form-group"><label>Candidate ID</label><input type="text" id="s6-id" value="CAND-001"></div>
                <button onclick="runEvaluateRisk()">Calculate Risk</button>
                <div id="res-6" class="response-area">Response...</div>
            </div>

            <!-- 7. Timeline -->
            <div class="api-section" style="grid-column: span 2;">
                <h3>7. Timeline (Audit Log)</h3>
                <div class="form-group"><input type="text" id="s7-id" value="CAND-001"></div>
                <button onclick="runGetTimeline()">Fetch Full History</button>
                <div id="res-7" class="response-area">History...</div>
            </div>
        </div>
    </main>
    <script src="/static/script.js"></script>
</body>

</html>
